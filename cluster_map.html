        function initMap() {
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 12.9716, lng: 77.5946 }, // Bengaluru coordinates
                zoom: 10
            });

            const geocoder = new google.maps.Geocoder();
            const markers = [];

            colleges.forEach(college => {
                geocoder.geocode({ address: college.address }, (results, status) => {
                    if (status === "OK") {
                        const pointerPath = "M 0,0 L 10,-30 A 10,10 0 1,1 -10,-30 L 0,0 Z";

                        const marker = new google.maps.Marker({
                            map: map,
                            position: results[0].geometry.location,
                            title: college.name,
                            icon: {
                                path: pointerPath, // Custom pointer SVG path
                                fillColor: zoneColors[college.cluster] || zoneColors.default,
                                fillOpacity: 1,
                                strokeWeight: 1,
                                strokeColor: "black",
                                scale: 1 // Adjust size to fit the map
                            }
                        });

                        const infoWindow = new google.maps.InfoWindow({
                            content: `<strong>${college.name}</strong>
                            <br>Intake: ${college.intake}
                            <br>Zone: ${college.cluster || "None"}`
                        });

                        marker.addListener("click", () => {
                            infoWindow.open(map, marker);
                        });

                        markers.push(marker);
                    } else {
                        console.error(`Geocode failed for ${college.name}: ${status}`);
                    }
                });
            });

            // Create the MarkerClusterer
            new MarkerClusterer(map, markers, {
                imagePath: "https://developers.google.com/maps/documentation/javascript/examples/markerclusterer/m",
            });
        }

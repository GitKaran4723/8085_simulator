        const clusterColors = {
            A: "crimson",       // A bold, eye-catching red
            B: "royalblue",     // A rich, vibrant blue
            C: "forestgreen",   // A strong, natural green
            D: "chartreuse",    // A bright lime-green
            E: "mediumpurple",  // A pleasing, soft purple
            F: "sienna",        // A warm brown
            G: "deepskyblue",   // A striking cyan
            H: "hotpink",       // A vivid pink
            I: "dimgray",       // A neutral, readable gray
            J: "gold",          // A luminous yellow
            default: "black"    // Neutral black
        }

        function initMap() {
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 12.9716, lng: 77.5946 }, // Bengaluru coordinates
                zoom: 10
            });

            const geocoder = new google.maps.Geocoder();
            const markers = [];

            colleges.forEach(college => {
                geocoder.geocode({ address: college.address }, (results, status) => {
                    if (status === "OK") {
                        const marker = new google.maps.Marker({
                            map: map,
                            position: results[0].geometry.location,
                            title: college.name,
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                fillColor: clusterColors[college.cluster] || clusterColors.default, // Use default if no cluster
                                fillOpacity: 1,
                                strokeWeight: 1,
                                scale: 7
                            }
                        });

                        const infoWindow = new google.maps.InfoWindow({
                            content: `<strong>${college.name}</strong>
                            <br>Intake: ${college.intake}
                            <br>Group: ${college.cluster || "None"}`
                        });

                        marker.addListener("click", () => {
                            infoWindow.open(map, marker);
                        });

                        markers.push(marker);
                    } else {
                        console.error(`Geocode failed for ${college.name}: ${status}`);
                    }
                });
            });

            // Create the MarkerClusterer
            new MarkerClusterer(map, markers, {
                imagePath: "https://developers.google.com/maps/documentation/javascript/examples/markerclusterer/m",
            });
        }
